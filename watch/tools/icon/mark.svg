<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Bambu Watch mark: an aperture (watching) around growing layer lines (a print) -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FB0FF"/>
      <stop offset="100%" stop-color="#3C6FD1"/>
    </linearGradient>
    <linearGradient id="layers" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFC65C"/>
      <stop offset="100%" stop-color="#E08A1E"/>
    </linearGradient>
  </defs>

  <!-- aperture ring -->
  <circle cx="512" cy="512" r="300" fill="none" stroke="url(#ring)" stroke-width="62"/>
  <!-- four notches: reads as an aperture, not a plain circle -->
  <g stroke="#111318" stroke-width="78" stroke-linecap="butt">
    <line x1="512" y1="150" x2="512" y2="232"/>
    <line x1="512" y1="792" x2="512" y2="874"/>
    <line x1="150" y1="512" x2="232" y2="512"/>
    <line x1="792" y1="512" x2="874" y2="512"/>
  </g>

  <!-- the print: layers narrowing upward, nozzle on top -->
  <g fill="url(#layers)">
    <rect x="332" y="606" width="360" height="54" rx="27"/>
    <rect x="372" y="524" width="280" height="54" rx="27"/>
    <rect x="412" y="442" width="200" height="54" rx="27"/>
  </g>
  <path d="M512 300 L568 384 L456 384 Z" fill="#E8EEF7"/>
</svg>
