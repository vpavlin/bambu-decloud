# What a print costs on proteus.
#
# Ink is derived from Brother's OWN yield figures (pages per bottle), not from a guessed
# millilitre consumption: the printer exposes no ink counter over USB, so yield is the only
# honest basis. Prices are Czech retail, seen 2026-11-07.
#
#   BTD100BK  black   169 Kč, up to 7500 pages   (Heureka listings 155-205 Kč)
#   BTD100C/M/Y colour 131 Kč each, up to 5000 pages
#   A4 80 g, 500 sheets  73-75 Kč  -> 0.15 Kč/sheet
#   10x15 photo paper, 100 sheets  94 Kč (ColorWay matte) -> 0.94 Kč/sheet
#   PETG 1 kg: 147 Kč (Prof. Lab) / 299 Kč (C-TECH) — depends what you buy
#   PLA white (the A1's slot 1) is usually a little dearer than budget PETG
#
# Replace anything you buy differently; the reporter only multiplies.

currency = "Kč"

# --- paper per sheet
paper_a4          = 0.15
paper_a5          = 0.08
paper_photo_10x15 = 0.94
paper_other       = 0.15

# --- ink: bottle price and Brother's rated yield
ink_black_price  = 169
ink_black_yield  = 7500
ink_colour_price = 131
ink_colour_yield = 5000

# Ink scales with COVERAGE, and Brother's yields are quoted at 5 % coverage per page
# (the industry norm). So cost = (coverage / 5 %) x (bottle price / rated pages), summed
# over the four inks. These are the coverage figures used when nothing else is known:
coverage_text  = 5      # a normal text page
coverage_photo = 100    # a full-bleed photograph, every pixel covered

# --- electricity
kwh              = 4.50
printer_watts    = 25

# --- 3D printing
filament_per_kg  = 300   # PETG ~147-299 Kč/kg retail; PLA similar
